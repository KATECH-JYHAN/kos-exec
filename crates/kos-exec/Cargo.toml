[package]
name = "kos-exec"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Jun-young Han <jyhan@katech.re.kr>"]
repository = "https://github.com/KATECH-JYHAN/kos-exec"

[dependencies]
nix = { version = "0.29", features = ["sched", "signal", "process"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
comm-core = { path = "../../../comm/crates/comm-core" }
kos-safety = { path = "../../../safety/crates/kos-safety" }
sha2 = "0.10"
libc = "0.2"
# iceoryx2 백엔드 (선택). 1.0 이전이라 API 변경이 잦아 정확한 버전으로 고정한다.
iceoryx2 = { version = "=0.10.0", optional = true }

[features]
iceoryx2 = ["dep:iceoryx2"]

[[bench]]
name = "deadline_stress"
harness = false

[[bench]]
name = "migration_cost"
harness = false

[[bench]]
name = "resource_manager_test"
harness = false

[[bench]]
name = "pinning_vs_cpuset"
harness = false

[[bench]]
name = "sleep_vs_nosleep"
harness = false

[[bench]]
name = "notify_latency"
harness = false

[[bench]]
name = "full_scenario"
harness = false

[[bench]]
name = "notify_bench"
harness = false

[[bench]]
name = "transport_compare"
harness = false
